name: Kohya dependency resolution

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  kohya-dependency-resolution:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install pytest uv==0.9.8
      - run: python -m pytest tests/test_kohya_dependency_resolution.py -q
        env:
          RUN_KOHYA_RESOLVER_TEST: "1"
